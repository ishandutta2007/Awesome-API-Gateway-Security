<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="flowGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="flowGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadows and Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shieldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Continuous Keyframe Animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.28; }
      50% { transform: scale(1.15); opacity: 0.45; }
    }
    @keyframes shieldBreath {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-7px) scale(1.02); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -120; }
    }
    @keyframes particleOrbit {
      0% { transform: rotate(0deg) translateX(42px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(42px) rotate(-360deg); }
    }
    @keyframes pillFloat1 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pillFloat2 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(8px); }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .ambient-orb {
      transform-origin: center;
      animation: pulseOrb 7s ease-in-out infinite;
    }
    .shield-element {
      transform-origin: 980px 210px;
      animation: shieldBreath 5s ease-in-out infinite;
    }
    .flow-line {
      stroke-dasharray: 12, 18;
      animation: dashMove 3.5s linear infinite;
    }
    .flow-line-reverse {
      stroke-dasharray: 10, 16;
      animation: dashMove 4.5s linear infinite reverse;
    }
    .pill-card-1 {
      animation: pillFloat1 6s ease-in-out infinite;
    }
    .pill-card-2 {
      animation: pillFloat2 7s ease-in-out infinite;
    }
    .orbiting-dot {
      transform-origin: 980px 210px;
      animation: particleOrbit 6s linear infinite;
    }
    .radar-circle {
      transform-origin: 980px 210px;
      animation: radarSweep 10s linear infinite;
    }
  </style>

  <!-- Deep Cyber Dark Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Technical Circuit Grid Background -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="120" y1="0" x2="120" y2="420" />
    <line x1="240" y1="0" x2="240" y2="420" />
    <line x1="360" y1="0" x2="360" y2="420" />
    <line x1="480" y1="0" x2="480" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="720" y1="0" x2="720" y2="420" />
    <line x1="840" y1="0" x2="840" y2="420" />
    <line x1="960" y1="0" x2="960" y2="420" />
    <line x1="1080" y1="0" x2="1080" y2="420" />
  </g>

  <!-- Ambient Dynamic Glow Orbs (Strictly in Background) -->
  <circle cx="200" cy="120" r="140" fill="#0284c7" opacity="0.18" class="ambient-orb" />
  <circle cx="1000" cy="220" r="180" fill="#7c3aed" opacity="0.22" class="ambient-orb" />

  <!-- Animated Data Flow Lines (Gateway Streams) -->
  <path d="M 680 120 C 800 120, 850 180, 930 190" fill="none" stroke="url(#flowGrad1)" stroke-width="2.5" class="flow-line" />
  <path d="M 680 300 C 800 300, 860 240, 930 225" fill="none" stroke="url(#flowGrad2)" stroke-width="2.5" class="flow-line-reverse" />
  <path d="M 620 210 L 920 210" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6, 8" opacity="0.4" class="flow-line" />

  <!-- Dynamic Security Shield & Gateway Nodes (Right Side Art) -->
  <g class="shield-element">
    <!-- Outer Radar Ring -->
    <circle cx="980" cy="210" r="110" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2" />
    <circle cx="980" cy="210" r="85" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="5, 8" stroke-opacity="0.35" class="radar-circle" />
    
    <!-- Shield Aura Background -->
    <path d="M 980 135 L 1038 165 C 1038 220 980 265 980 265 C 980 265 922 220 922 165 Z"
          fill="url(#shieldGrad)" opacity="0.18" filter="url(#shieldGlow)" />
    
    <!-- Shield Main Body -->
    <path d="M 980 145 L 1030 172 C 1030 218 980 252 980 252 C 980 252 930 218 930 172 Z"
          fill="none" stroke="url(#cyanPurple)" stroke-width="3" filter="url(#glow)" />
    
    <!-- Inner Gateway Core Symbol -->
    <rect x="965" y="185" width="30" height="30" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <!-- Lock / Gateway Keyhole Icon -->
    <path d="M 975 195 A 5 5 0 0 1 985 195 L 985 200 L 975 200 Z" fill="none" stroke="#38bdf8" stroke-width="1.8" />
    <circle cx="980" cy="203" r="2" fill="#38bdf8" />
    <line x1="980" y1="205" x2="980" y2="209" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />

    <!-- Orbiting Guard Particles -->
    <circle cx="980" cy="210" r="4" fill="#38bdf8" class="orbiting-dot" filter="url(#glow)" />
  </g>

  <!-- Interactive/Dynamic Feature Badges (Floating Safely in Empty Quadrants) -->
  <g class="pill-card-1">
    <rect x="880" y="60" width="190" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="902" cy="78" r="6" fill="#10b981" />
    <text x="918" y="83" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.5">RUNTIME DEFENSE</text>
  </g>

  <g class="pill-card-2">
    <rect x="870" y="325" width="210" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="892" cy="343" r="6" fill="#8b5cf6" />
    <text x="908" y="348" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.5">OWASP API TOP 10</text>
  </g>

  <!-- Foreground Main Typography Area (100% Unobstructed & Crisp) -->
  <g transform="translate(70, 0)">
    <!-- Category Pill Tag -->
    <rect x="0" y="70" width="245" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="16" cy="86" r="4.5" fill="#38bdf8" />
    <text x="28" y="91" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CURATED SECURITY ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="165" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">
      Awesome API Gateway
    </text>
    <text x="0" y="222" fill="url(#cyanPurple)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">
      Security &amp; Protection
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="272" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      Enterprise SaaS Platforms • Self-Hosted Cloud-Native Proxies • AI Agent Gateways
    </text>

    <!-- Capabilities Highlights Pills Row -->
    <g transform="translate(0, 310)">
      <rect x="0" y="0" width="135" height="28" rx="6" fill="#1e293b" opacity="0.9" stroke="#334155" stroke-width="1" />
      <text x="12" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">🔒 WAF &amp; Rate Limits</text>

      <rect x="145" y="0" width="145" height="28" rx="6" fill="#1e293b" opacity="0.9" stroke="#334155" stroke-width="1" />
      <text x="157" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">🔍 API Discovery &amp; mTLS</text>

      <rect x="300" y="0" width="135" height="28" rx="6" fill="#1e293b" opacity="0.9" stroke="#334155" stroke-width="1" />
      <text x="312" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">🤖 MCP &amp; AI Defense</text>
    </g>
  </g>
</svg>
